[tools]
java = "temurin-21"

[tasks.test]
description = "Run Android offline-core unit tests"
run = "./gradlew :app:testDebugUnitTest --no-daemon --stacktrace"

[tasks.build]
description = "Assemble the Android offline-core debug artifact"
run = "./gradlew :app:assembleDebug --no-daemon --stacktrace"

[tasks.screen-test]
description = "Run feature screen instrumentation against a connected Android device or emulator"
run = "./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.micrantha.eyespie.features --no-daemon --stacktrace"

[tasks.android-runtime-verify]
description = "Verify the staged Android runtime model offline against the pinned manifest"
run = "./gradlew :app:verifyAndroidRuntime --no-daemon --stacktrace"

[tasks.android-runtime]
description = "Provision, verify, then build and install a runnable Android debug app"
run = """
./gradlew :app:stageAndroidImageEmbedderModel --no-daemon --stacktrace
./gradlew :app:verifyAndroidRuntime --no-daemon --stacktrace
./gradlew :app:installDebug --no-daemon --stacktrace
"""

[tasks.brand-verify]
description = "Verify Micrantha Lens palette, launch surfaces, and platform icon wiring"
run = "python3 scripts/validate_brand_assets.py"

[tasks.ci]
description = "Run release-evidence verification plus the Android offline-core gate"
run = """
python3 scripts/validate_brand_assets.py
python3 scripts/release_candidate_identity.py verify
python3 -m unittest discover -s scripts/tests -p 'test_*.py'
./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -u+x -print 2>/dev/null | sort -V | tail -n 1)"
test -n "$APKANALYZER" || { echo "apkanalyzer was not found under ANDROID_HOME/cmdline-tools" >&2; exit 1; }
APK_COUNT="$(find eyespie/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print | wc -l | tr -d ' ')"
test "$APK_COUNT" = "1" || { echo "expected exactly one debug APK; found $APK_COUNT" >&2; exit 1; }
APK="$(find eyespie/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
if "$APKANALYZER" manifest permissions "$APK" | grep -Fxq 'android.permission.INTERNET'; then
  echo "Android offline-core artifact unexpectedly requests INTERNET" >&2
  exit 1
fi
"""
