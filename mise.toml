[tools]
java = "temurin-21"

[tasks.test]
description = "Run Android offline-core unit tests"
run = "./gradlew :app:testDebugUnitTest --no-daemon --stacktrace"

[tasks.build]
description = "Assemble the Android offline-core debug artifact"
run = "./gradlew :app:assembleDebug --no-daemon --stacktrace"

[tasks.ci]
description = "Run release-evidence verification plus the Android offline-core gate"
run = """
python3 scripts/release_candidate_identity.py verify
python3 -m unittest scripts.tests.test_compare_image_embedding_calibration
./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
"""
