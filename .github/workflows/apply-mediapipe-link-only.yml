name: Validate MediaPipe framework headers

on:
  push:
    branches: [agent/mediapipe-ios-0.10.26.1]
    paths: [.github/workflows/apply-mediapipe-link-only.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-read-only: true
      - run: sudo gem install cocoapods -v 1.17.0 --no-document
      - name: Compile framework-qualified cinterop
        shell: bash
        run: |
          set -euo pipefail
          cp env.example .env.local
          printf '%s\n' '#pragma once' '/* implementation-only */' > iosApp/MediaPipePodspecs/EyespieMediaPipeTasksCommonInterop.h
          echo '' | base64 --decode | python3
          ./gradlew :app:podspec :app:generateDummyFramework :app:compileKotlinIosSimulatorArm64 :app:compileTestKotlinIosSimulatorArm64 --no-daemon --stacktrace
          cd iosApp
          rm -rf Pods Podfile.lock
          pod install --repo-update
      - name: Commit successful graph
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-mediapipe-link-only.yml .github/workflows/restore-mediapipe-full-cinterop.yml .github/workflows/validate-common-cinterop-shim.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ios): use framework-qualified MediaPipe headers'
          git push origin HEAD:agent/mediapipe-ios-0.10.26.1
