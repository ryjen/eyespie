name: Apply MediaPipe link-only implementation pods

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/apply-mediapipe-link-only.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Set up CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 --no-document

      - name: Apply and validate link-only graph
        shell: bash
        run: |
          set -euo pipefail
          cp env.example .env.local

          python3 - <<'PY'
          from pathlib import Path

          build = Path("eyespie/build.gradle.kts")
          text = build.read_text()
          old = '''        // Common and GenAIC are implementation pods. Their API pods pull them
                  // transitively, so Kotlin cinterop is generated only for public frameworks.
                  pod("EyespieMediaPipeTasksVision") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksVision"
                      packageName = "MediaPipeTasksVision"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }
                  pod("EyespieMediaPipeTasksGenAI") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksGenAI"
                      packageName = "MediaPipeTasksGenAI"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }'''
          new = '''        // Declare all local pods so Kotlin's synthetic Podfile can resolve the
                  // complete namespaced graph. Common and GenAIC are implementation/link pods;
                  // only Vision and GenAI expose Kotlin cinterop APIs.
                  pod("EyespieMediaPipeTasksCommon") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      linkOnly = true
                  }
                  pod("EyespieMediaPipeTasksVision") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksVision"
                      packageName = "MediaPipeTasksVision"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }
                  pod("EyespieMediaPipeTasksGenAIC") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      linkOnly = true
                  }
                  pod("EyespieMediaPipeTasksGenAI") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksGenAI"
                      packageName = "MediaPipeTasksGenAI"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }'''
          if text.count(old) != 1:
              raise SystemExit("expected API-only MediaPipe block exactly once")
          build.write_text(text.replace(old, new))

          workflow = Path(".github/workflows/ios-mediapipe.yml")
          text = workflow.read_text()
          old = '''          for pod in EyespieMediaPipeTasksVision EyespieMediaPipeTasksGenAI; do
                      if ! grep -Fq "pod(\\\"$pod\\\")" eyespie/build.gradle.kts; then
                        echo "Kotlin CocoaPods does not bind API pod $pod" >&2
                        exit 1
                      fi
                    done
                    for pod in EyespieMediaPipeTasksCommon EyespieMediaPipeTasksGenAIC; do
                      if grep -Fq "pod(\\\"$pod\\\")" eyespie/build.gradle.kts; then
                        echo "Kotlin CocoaPods must not generate cinterop for implementation pod $pod" >&2
                        exit 1
                      fi
                    done'''
          new = '''          for pod in \\
                      EyespieMediaPipeTasksCommon \\
                      EyespieMediaPipeTasksVision \\
                      EyespieMediaPipeTasksGenAIC \\
                      EyespieMediaPipeTasksGenAI; do
                      if ! grep -Fq "pod(\\\"$pod\\\")" eyespie/build.gradle.kts; then
                        echo "Kotlin CocoaPods does not declare $pod" >&2
                        exit 1
                      fi
                    done
                    for pod in EyespieMediaPipeTasksCommon EyespieMediaPipeTasksGenAIC; do
                      block="$(sed -n "/pod(\\\"$pod\\\") {/,/^[[:space:]]*}/p" eyespie/build.gradle.kts)"
                      grep -Fq 'linkOnly = true' <<<"$block" || {
                        echo "$pod must remain link-only" >&2
                        exit 1
                      }
                    done'''
          if text.count(old) != 1:
              raise SystemExit("expected API-only source assertion exactly once")
          text = text.replace(old, new)

          old = '''          for pod in EyespieMediaPipeTasksVision EyespieMediaPipeTasksGenAI; do
                      grep -Fq "spec.dependency '$pod'" eyespie/eyespie.podspec
                    done
                    for pod in EyespieMediaPipeTasksCommon EyespieMediaPipeTasksGenAIC; do
                      if grep -Fq "spec.dependency '$pod'" eyespie/eyespie.podspec; then
                        echo "Generated eyespie podspec directly declares implementation pod $pod" >&2
                        exit 1
                      fi
                    done'''
          new = '''          for pod in \\
                      EyespieMediaPipeTasksCommon \\
                      EyespieMediaPipeTasksVision \\
                      EyespieMediaPipeTasksGenAIC \\
                      EyespieMediaPipeTasksGenAI; do
                      grep -Fq "spec.dependency '$pod'" eyespie/eyespie.podspec
                    done'''
          if text.count(old) != 1:
              raise SystemExit("expected API-only generated podspec assertion exactly once")
          workflow.write_text(text.replace(old, new))
          PY

          ./gradlew \
            :app:podspec \
            :app:generateDummyFramework \
            :app:compileKotlinIosSimulatorArm64 \
            :app:compileTestKotlinIosSimulatorArm64 \
            --no-daemon \
            --stacktrace

          (
            cd iosApp
            rm -rf Pods Podfile.lock
            pod install --repo-update
          )

          for pod in EyespieMediaPipeTasksCommon EyespieMediaPipeTasksVision EyespieMediaPipeTasksGenAIC EyespieMediaPipeTasksGenAI; do
            grep -Fq "spec.dependency '$pod'" eyespie/eyespie.podspec
            grep -Fq "$pod (0.10.26.1)" iosApp/Podfile.lock
          done
          git diff --check

      - name: Commit validated graph and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-mediapipe-link-only.yml \
            .github/workflows/restore-mediapipe-full-cinterop.yml \
            .github/workflows/validate-common-cinterop-shim.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): link implementation MediaPipe pods without cinterop"
          git push origin HEAD:agent/mediapipe-ios-0.10.26.1
