name: Validate framework-qualified MediaPipe headers

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/apply-mediapipe-link-only.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Set up CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 --no-document

      - name: Configure and compile all four local pods
        shell: bash
        run: |
          set -euo pipefail
          cp env.example .env.local
          cat > iosApp/MediaPipePodspecs/EyespieMediaPipeTasksCommonInterop.h <<'EOF'
          #pragma once
          /* Common is implementation-only and intentionally exposes no Kotlin API. */
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path("eyespie/build.gradle.kts")
          text = path.read_text()
          start = text.index('        // Common and GenAIC are implementation pods.')
          end = text.index('    }\n\n    applyDefaultHierarchyTemplate()', start)
          block = '''        // Declare all local pods so Kotlin's synthetic Podfile resolves the
          // complete namespaced graph. Framework-qualified umbrella headers avoid
          // relying on module discovery for the vendored XCFrameworks.
          pod("EyespieMediaPipeTasksCommon") {
              version = "0.10.26.1"
              source = path(project.file("../iosApp/MediaPipePodspecs"))
              headers = project.file("../iosApp/MediaPipePodspecs/EyespieMediaPipeTasksCommonInterop.h").absolutePath
              packageName = "MediaPipeTasksCommon"
          }
          pod("EyespieMediaPipeTasksVision") {
              version = "0.10.26.1"
              source = path(project.file("../iosApp/MediaPipePodspecs"))
              headers = "MediaPipeTasksVision/MediaPipeTasksVision.h"
              packageName = "MediaPipeTasksVision"
              extraOpts += listOf("-compiler-option", "-fmodules")
          }
          pod("EyespieMediaPipeTasksGenAIC") {
              version = "0.10.26.1"
              source = path(project.file("../iosApp/MediaPipePodspecs"))
              headers = "MediaPipeTasksGenAIC/MediaPipeTasksGenAIC.h"
              packageName = "MediaPipeTasksGenAIC"
              extraOpts += listOf("-compiler-option", "-fmodules")
          }
          pod("EyespieMediaPipeTasksGenAI") {
              version = "0.10.26.1"
              source = path(project.file("../iosApp/MediaPipePodspecs"))
              headers = "MediaPipeTasksGenAI/MediaPipeTasksGenAI.h"
              packageName = "MediaPipeTasksGenAI"
              extraOpts += listOf("-compiler-option", "-fmodules")
              useInteropBindingFrom("EyespieMediaPipeTasksGenAIC")
          }
'''
          path.write_text(text[:start] + block + text[end:])
          PY

          ./gradlew \
            :app:podspec \
            :app:generateDummyFramework \
            :app:compileKotlinIosSimulatorArm64 \
            :app:compileTestKotlinIosSimulatorArm64 \
            --no-daemon \
            --stacktrace

          (
            cd iosApp
            rm -rf Pods Podfile.lock
            pod install --repo-update
          )
          for pod in EyespieMediaPipeTasksCommon EyespieMediaPipeTasksVision EyespieMediaPipeTasksGenAIC EyespieMediaPipeTasksGenAI; do
            grep -Fq "spec.dependency '$pod'" eyespie/eyespie.podspec
            grep -Fq "$pod (0.10.26.1)" iosApp/Podfile.lock
          done
          git diff --check

      - name: Commit validated graph and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-mediapipe-link-only.yml \
            .github/workflows/restore-mediapipe-full-cinterop.yml \
            .github/workflows/validate-common-cinterop-shim.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): use framework-qualified MediaPipe headers"
          git push origin HEAD:agent/mediapipe-ios-0.10.26.1
