name: Fix MediaPipe source directory

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/fix-mediapipe-source-directory.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Use the podspec directory for Kotlin CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("eyespie/build.gradle.kts")
          text = path.read_text()
          replacements = {
              "../iosApp/MediaPipePodspecs/EyespieMediaPipeTasksCommon.podspec": "../iosApp/MediaPipePodspecs",
              "../iosApp/MediaPipePodspecs/EyespieMediaPipeTasksVision.podspec": "../iosApp/MediaPipePodspecs",
              "../iosApp/MediaPipePodspecs/EyespieMediaPipeTasksGenAIC.podspec": "../iosApp/MediaPipePodspecs",
              "../iosApp/MediaPipePodspecs/EyespieMediaPipeTasksGenAI.podspec": "../iosApp/MediaPipePodspecs",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one source path: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

          rm .github/workflows/fix-mediapipe-source-directory.yml
          git diff --check
          test "$(grep -Fc 'source = path(project.file("../iosApp/MediaPipePodspecs"))' eyespie/build.gradle.kts)" -eq 4

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): use podspec directory for Kotlin CocoaPods"
          git push origin HEAD:agent/mediapipe-ios-0.10.26.1
