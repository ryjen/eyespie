name: Android screen instrumentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eyespie-screen-instrumentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feature-screens:
    name: hosted-android-feature-screens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.7.13
          install: true
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Stage pinned Android runtime model
        run: ./gradlew :app:stageAndroidImageEmbedderModel --no-daemon --stacktrace

      - name: Verify staged Android runtime offline
        run: ./gradlew :app:verifyAndroidRuntime --offline --no-daemon --stacktrace

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run feature screen instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: >-
            -no-snapshot-load
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-metrics
            -camera-back emulated
            -camera-front none
          script: bash scripts/run_android_screen_instrumentation.sh

      - name: Upload installed-build visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-screen-instrumentation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/ci/android-screen-instrumentation/
            eyespie/build/reports/androidTests/connected/
            eyespie/build/outputs/androidTest-results/connected/
