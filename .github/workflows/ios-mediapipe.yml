name: iOS MediaPipe Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "eyespie/**"
      - "iosApp/**"
      - "docs/release/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - ".github/workflows/ios-mediapipe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-mediapipe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-mediapipe:
    name: ios-offline-core-mediapipe
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Set up CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 --no-document
      - name: Assert local MediaPipe pod graph
        shell: bash
        run: |
          set -euo pipefail
          for pod in EyespieMediaPipeTasksCommon EyespieMediaPipeTasksVision EyespieMediaPipeTasksGenAIC EyespieMediaPipeTasksGenAI; do
            test -f "iosApp/MediaPipePodspecs/${pod}.podspec"
            grep -Fq "pod(\"$pod\")" eyespie/build.gradle.kts
          done
      - name: Generate Kotlin podspec and framework
        run: ./gradlew :app:podspec :app:generateDummyFramework --no-daemon --stacktrace
      - name: Install pods
        working-directory: iosApp
        run: pod install --repo-update
      - name: Compile Kotlin for iOS simulator
        run: ./gradlew :app:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace
      - name: Build iOS simulator application
        run: |
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build/ios-offline-core" \
            CODE_SIGNING_ALLOWED=NO \
            build
