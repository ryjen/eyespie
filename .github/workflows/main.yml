name: EyesPie CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eyespie-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Create build configuration
        run: cp env.example .env.local

      - name: Verify model metadata contract
        run: python3 scripts/stage_android_model_artifact.py verify

      - name: Test Android bundle topology validator
        run: python3 -m unittest scripts.tests.test_validate_android_bundle

      - name: Compile Android production and unit-test sources
        run: >-
          ./gradlew
          :bluebell:compileDebugKotlinAndroid
          :bluebell:compileDebugUnitTestKotlinAndroid
          :app:compileDebugKotlinAndroid
          :app:compileDebugUnitTestKotlinAndroid
          --no-daemon
          --parallel
          --build-cache
          --configuration-cache

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eyespie-validation-diagnostics-${{ github.sha }}
          path: |
            **/build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  android-tests:
    name: android-tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Create build configuration
        run: cp env.example .env.local

      - name: Run Android unit and snapshot tests
        run: >-
          ./gradlew
          :bluebell:testDebugUnitTest
          :app:testDebugUnitTest
          --no-daemon
          --parallel
          --build-cache
          --configuration-cache

      - name: Upload Android test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eyespie-android-test-diagnostics-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/outputs/roborazzi/**
            **/build/roborazzi/**
            **/build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  android-bundle:
    name: android-bundle
    needs: [validate, android-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Create build configuration
        run: cp env.example .env.local

      - name: Build debug app bundle with asset packs
        run: >-
          ./gradlew
          :app:bundleDebug
          --no-daemon
          --parallel
          --build-cache
          --configuration-cache

      - name: Resolve generated debug bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(eyespie/build/outputs/bundle/debug/*.aab)
          if (( ${#bundles[@]} != 1 )); then
            printf 'expected exactly one debug AAB, found %d\n' "${#bundles[@]}" >&2
            printf 'candidate: %s\n' "${bundles[@]:-none}" >&2
            exit 1
          fi
          printf 'AAB_PATH=%s\n' "${bundles[0]}" >> "$GITHUB_ENV"

      - name: Download pinned bundletool
        shell: bash
        run: |
          set -euo pipefail
          version=1.18.3
          expected_sha256=a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          mkdir -p build/tools
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output build/tools/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${version}/bundletool-all-${version}.jar"
          printf '%s  %s\n' "$expected_sha256" build/tools/bundletool.jar | sha256sum --check --strict

      - name: Decode model-pack manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/android-bundle
          java -jar build/tools/bundletool.jar dump manifest \
            --bundle="$AAB_PATH" \
            --module=model_pack \
            > build/reports/android-bundle/model-pack-manifest.xml

      - name: Validate bundle and model-pack topology
        run: >-
          python3 scripts/validate_android_bundle.py
          --aab "$AAB_PATH"
          --model-pack-manifest build/reports/android-bundle/model-pack-manifest.xml
          --report build/reports/android-bundle/topology.md

      - name: Add topology report to workflow summary
        run: cat build/reports/android-bundle/topology.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eyespie-android-bundle-diagnostics-${{ github.sha }}
          path: |
            **/build/reports/problems/**
            build/reports/android-bundle/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bundle topology report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eyespie-android-bundle-topology-${{ github.sha }}
          path: build/reports/android-bundle/topology.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eyespie-debug-aab-${{ github.sha }}
          path: eyespie/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 7
