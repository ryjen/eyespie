name: EyesPie CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eyespie-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Validate Fastlane configuration
        run: bundle exec fastlane lanes

      - name: Run canonical validation lane
        run: bundle exec fastlane android validate

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eyespie-validation-diagnostics-${{ github.sha }}
          path: |
            **/build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  supabase-security:
    name: supabase-security
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1

      - name: Start local Supabase
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/supabase-start.log"
          set +e
          supabase start --debug 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          if (( status != 0 )); then
            diagnostic="$(
              grep -Eai 'error|fatal|fail(ed|ure)?|unhealthy|tim(e|ed)[ -]?out|stopping|exited|denied|panic' "$log" \
                | tail -n 30 \
                || true
            )"
            if [[ -z "$diagnostic" ]]; then
              diagnostic="$(tail -n 30 "$log")"
            fi
            excerpt="$(printf '%s\n' "$diagnostic" | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN { ORS="%0A" } { print }')"
            echo "::error title=Supabase local startup::$excerpt"
          fi
          exit "$status"

      - name: Replay migrations from scratch
        run: supabase db reset

      - name: Exercise Thing authority and Storage RLS
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            --host 127.0.0.1 \
            --port 54322 \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --file scripts/tests/thing_authority_runtime.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  android-tests:
    name: android-tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run canonical Android test lane
        run: bundle exec fastlane android test

      - name: Upload Android test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eyespie-android-test-diagnostics-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/outputs/roborazzi/**
            **/build/roborazzi/**
            **/build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  android-bundle:
    name: android-bundle
    needs: [validate, supabase-security, android-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run canonical Android bundle lane
        run: bundle exec fastlane android bundle_debug

      - name: Add topology report to workflow summary
        run: cat build/reports/android-bundle/topology.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eyespie-android-bundle-diagnostics-${{ github.sha }}
          path: |
            **/build/reports/problems/**
            build/reports/android-bundle/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bundle topology report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eyespie-android-bundle-topology-${{ github.sha }}
          path: build/reports/android-bundle/topology.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eyespie-debug-aab-${{ github.sha }}
          path: eyespie/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 7

  production:
    name: production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: android-bundle
    uses: ./.github/workflows/deploy-environment.yml
    with:
      deployment_environment: production
      fastlane_lane: distribute_production
