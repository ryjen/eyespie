name: EyesPie CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eyespie-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android-offline-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools with mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.7.13
          install: true
          cache: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Test and assemble offline core
        run: mise run ci

      - name: Preserve failed Android verification diagnostics
        id: diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eyespie-offline-core-failure-${{ github.run_id }}
          path: |
            eyespie/build/reports/tests/
            eyespie/build/test-results/
            eyespie/build/outputs/logs/
          if-no-files-found: error
          retention-days: 7

      - name: Clean task-local Gradle outputs after evidence handling
        if: ${{ always() && (success() || steps.diagnostics.outcome == 'success') }}
        run: ./gradlew clean --no-daemon --stacktrace
