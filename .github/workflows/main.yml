name: EyesPie CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eyespie-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android-offline-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools with mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          version: 2026.7.13
          install: true
          cache: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Test and assemble offline core
        run: mise run ci

      - name: Preserve failed Android verification diagnostics
        id: diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eyespie-offline-core-failure-${{ github.run_id }}
          path: |
            eyespie/build/reports/tests/
            eyespie/build/test-results/
            eyespie/build/outputs/logs/
          if-no-files-found: error
          retention-days: 7

      - name: Clean task-local Gradle outputs after evidence handling
        if: ${{ always() && (success() || steps.diagnostics.outcome == 'success') }}
        run: ./gradlew clean --no-daemon --stacktrace
