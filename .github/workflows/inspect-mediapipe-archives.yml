name: Inspect MediaPipe archive modules

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/inspect-mediapipe-archives.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect released headers and module maps
        shell: bash
        run: |
          set -euo pipefail
          version="0.10.26.1"
          tag="eyespie-ios-v0.10.26.1"
          base="https://github.com/ryjen/mediapipe/releases/download/${tag}"
          for component in Common Vision GenAIC GenAI; do
            archive="MediaPipeTasks${component}-${version}.tar.gz"
            mkdir -p "$component"
            curl -fsSL --retry 2 "$base/$archive" -o "$archive"
            tar -xzf "$archive" -C "$component"
            echo "===== MediaPipeTasks${component} ====="
            find "$component" -type f \( -name 'module.modulemap' -o -path '*/Headers/*' \) -print | sort
            echo "----- module maps -----"
            while IFS= read -r modulemap; do
              echo "### $modulemap"
              sed -n '1,120p' "$modulemap"
            done < <(find "$component" -type f -name 'module.modulemap' | sort)
          done
