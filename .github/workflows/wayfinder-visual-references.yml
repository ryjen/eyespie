name: Wayfinder visual references

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eyespie-wayfinder-goldens-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-references:
    name: wayfinder-roborazzi
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install tools with mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.7.13
          install: true
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Record reviewed Wayfinder references
        run: ./gradlew :app:recordRoborazziDebug --no-daemon --stacktrace

      - name: Commit reviewed references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eyespie/src/androidUnitTest/goldens/wayfinder/*.png
          if git diff --cached --quiet; then
            echo "Reviewed references already committed."
            exit 0
          fi
          git commit -m "test(ui): accept reviewed Wayfinder composition goldens"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
