name: Wayfinder visual references

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eyespie-wayfinder-goldens-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-references:
    name: wayfinder-roborazzi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.7.13
          install: true
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Verify deterministic Wayfinder references
        run: ./gradlew :app:verifyRoborazziDebug --no-daemon --stacktrace

      - name: Upload visual diff diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wayfinder-roborazzi-diff-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            eyespie/build/reports/roborazzi/
            eyespie/build/outputs/roborazzi/
            eyespie/build/test-results/roborazzi/
