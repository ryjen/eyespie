name: Wayfinder visual references

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eyespie-wayfinder-goldens-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-references:
    name: wayfinder-roborazzi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        with:
          version: 2026.7.13
          install: true
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Verify deterministic Wayfinder references
        run: ./gradlew :app:verifyRoborazziDebug --no-daemon --stacktrace

      - name: Upload visual diff diagnostics
        id: diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wayfinder-roborazzi-diff-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            eyespie/build/reports/roborazzi/
            eyespie/build/outputs/roborazzi/
            eyespie/build/test-results/roborazzi/

      - name: Clean task-local Gradle outputs after visual evidence handling
        if: ${{ always() && (success() || steps.diagnostics.outcome == 'success') }}
        run: ./gradlew clean --no-daemon --stacktrace
