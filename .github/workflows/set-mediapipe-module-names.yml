name: Set MediaPipe module names

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/set-mediapipe-module-names.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Configure exported MediaPipe module names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("eyespie/build.gradle.kts")
          text = path.read_text()
          modules = (
              "MediaPipeTasksCommon",
              "MediaPipeTasksVision",
              "MediaPipeTasksGenAIC",
              "MediaPipeTasksGenAI",
          )
          for module in modules:
              old = f'            packageName = "{module}"'
              new = f'            moduleName = "{module}"\n{old}'
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one packageName for {module}")
              if f'moduleName = "{module}"' in text:
                  raise SystemExit(f"moduleName already configured for {module}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

          git diff --check
          grep -n -E 'moduleName|packageName = "MediaPipeTasks' eyespie/build.gradle.kts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eyespie/build.gradle.kts
          git commit -m "fix(ios): map pod names to MediaPipe framework modules"
          git push origin HEAD:agent/mediapipe-ios-0.10.26.1
