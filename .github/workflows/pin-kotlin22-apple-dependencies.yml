name: Pin Kotlin 2.2 Apple dependencies

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/pin-kotlin22-apple-dependencies.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply documented Kotlin 2.2 compatibility pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("gradle/libs.versions.toml")
          text = path.read_text()
          replacements = {
              'kamelImage = "1.0.9"': 'kamelImage = "1.0.8"',
              'supabaseKt = "3.6.0"': 'supabaseKt = "3.4.1"',
              'kotlinxSerializationJson = "1.11.0"': 'kotlinxSerializationJson = "1.9.0"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one version declaration: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

          rm .github/workflows/pin-kotlin22-apple-dependencies.yml
          git diff --check
          grep -E '^(kamelImage|supabaseKt|kotlinxSerializationJson) =' gradle/libs.versions.toml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(apple): restore Kotlin 2.2 compatible dependencies"
          git push origin HEAD:agent/mediapipe-ios-0.10.26.1
