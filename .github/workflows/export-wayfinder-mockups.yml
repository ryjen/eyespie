name: Export Wayfinder mockups

on:
  push:
    branches: [feat/287-wayfinder-goldens]

permissions:
  contents: read

jobs:
  export-mockups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload canonical mockup tiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-wayfinder-mockups-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: docs/design/eyespie-app-mockups/*.webp
