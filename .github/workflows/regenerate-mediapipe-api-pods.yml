name: Regenerate MediaPipe API pod metadata

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/regenerate-mediapipe-api-pods.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 --no-document

      - name: Configure API pods and regenerate metadata
        shell: bash
        run: |
          set -euo pipefail
          cp env.example .env.local
          python3 - <<'PY'
          from pathlib import Path

          path = Path("eyespie/build.gradle.kts")
          text = path.read_text()
          old = '''        pod("EyespieMediaPipeTasksCommon") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksCommon"
                      packageName = "MediaPipeTasksCommon"
                  }
                  pod("EyespieMediaPipeTasksVision") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksVision"
                      packageName = "MediaPipeTasksVision"
                      useInteropBindingFrom("EyespieMediaPipeTasksCommon")
                  }
                  pod("EyespieMediaPipeTasksGenAIC") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksGenAIC"
                      packageName = "MediaPipeTasksGenAIC"
                      useInteropBindingFrom("EyespieMediaPipeTasksCommon")
                  }
                  pod("EyespieMediaPipeTasksGenAI") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksGenAI"
                      packageName = "MediaPipeTasksGenAI"
                      useInteropBindingFrom("EyespieMediaPipeTasksGenAIC")
                  }'''
          new = '''        // Common and GenAIC are implementation pods. Their API pods pull them
                  // transitively, so Kotlin cinterop is generated only for public frameworks.
                  pod("EyespieMediaPipeTasksVision") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksVision"
                      packageName = "MediaPipeTasksVision"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }
                  pod("EyespieMediaPipeTasksGenAI") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksGenAI"
                      packageName = "MediaPipeTasksGenAI"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one four-pod Kotlin CocoaPods block")
          path.write_text(text.replace(old, new))
          PY

          ./gradlew :app:podspec :app:generateDummyFramework --no-daemon --stacktrace
          (
            cd iosApp
            rm -rf Pods Podfile.lock
            pod install --repo-update
          )

          git diff --check
          grep "spec.dependency 'EyespieMediaPipeTasks" eyespie/eyespie.podspec
          grep -E '^  - EyespieMediaPipeTasks(Common|Vision|GenAIC|GenAI) \(0\.10\.26\.1\)' iosApp/Podfile.lock

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eyespie/build.gradle.kts eyespie/eyespie.podspec iosApp/Podfile.lock
          git commit -m "fix(ios): bind only public MediaPipe API frameworks"
          git push origin HEAD:agent/mediapipe-ios-0.10.26.1
