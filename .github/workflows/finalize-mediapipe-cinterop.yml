name: Finalize MediaPipe cinterop

on:
  push:
    branches: [agent/mediapipe-ios-0.10.26.1]
    paths: [.github/workflows/finalize-mediapipe-cinterop.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-read-only: true
      - run: sudo gem install cocoapods -v 1.17.0 --no-document
      - name: Compile explicit-header cinterop
        shell: bash
        run: |
          set -euo pipefail
          cp env.example .env.local
          printf '%s\n' '#pragma once' '/* implementation-only */' > iosApp/MediaPipePodspecs/EyespieMediaPipeTasksCommonInterop.h
          python3 - <<'PY'
          from pathlib import Path

          path = Path("eyespie/build.gradle.kts")
          text = path.read_text()
          start = text.index("        // Common and GenAIC are implementation pods.")
          end = text.index("    }\n\n    applyDefaultHierarchyTemplate()", start)
          block = '''        // Declare all local pods so Kotlin's synthetic Podfile resolves the
          // complete namespaced graph. Explicit umbrella headers and module mode
          // are mutually exclusive in Kotlin/Native cinterop.
          pod("EyespieMediaPipeTasksCommon") {
              version = "0.10.26.1"
              source = path(project.file("../iosApp/MediaPipePodspecs"))
              headers = project.file("../iosApp/MediaPipePodspecs/EyespieMediaPipeTasksCommonInterop.h").absolutePath
              packageName = "MediaPipeTasksCommon"
          }
          pod("EyespieMediaPipeTasksVision") {
              version = "0.10.26.1"
              source = path(project.file("../iosApp/MediaPipePodspecs"))
              headers = "MediaPipeTasksVision/MediaPipeTasksVision.h"
              packageName = "MediaPipeTasksVision"
          }
          pod("EyespieMediaPipeTasksGenAIC") {
              version = "0.10.26.1"
              source = path(project.file("../iosApp/MediaPipePodspecs"))
              headers = "MediaPipeTasksGenAIC/MediaPipeTasksGenAIC.h"
              packageName = "MediaPipeTasksGenAIC"
          }
          pod("EyespieMediaPipeTasksGenAI") {
              version = "0.10.26.1"
              source = path(project.file("../iosApp/MediaPipePodspecs"))
              headers = "MediaPipeTasksGenAI/MediaPipeTasksGenAI.h"
              packageName = "MediaPipeTasksGenAI"
              useInteropBindingFrom("EyespieMediaPipeTasksGenAIC")
          }
          }'''
          path.write_text(text[:start] + block + text[end:])
          PY
          ./gradlew :app:podspec :app:generateDummyFramework :app:compileKotlinIosSimulatorArm64 :app:compileTestKotlinIosSimulatorArm64 --no-daemon --stacktrace
          (
            cd iosApp
            rm -rf Pods Podfile.lock
            pod install --repo-update
          )
          git diff --check
      - name: Commit successful graph
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-mediapipe-link-only.yml \
            .github/workflows/restore-mediapipe-full-cinterop.yml \
            .github/workflows/validate-common-cinterop-shim.yml \
            .github/workflows/finalize-mediapipe-cinterop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ios): use explicit MediaPipe headers without modules'
          git push origin HEAD:agent/mediapipe-ios-0.10.26.1
