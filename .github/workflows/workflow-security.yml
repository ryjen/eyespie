name: Workflow Security

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - "scripts/tests/test_internal_distribution_source_gate.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - "scripts/tests/test_internal_distribution_source_gate.py"
  workflow_dispatch:

env:
  ZIZMOR_VERSION: "1.28.0"

permissions:
  contents: read

concurrency:
  group: eyespie-workflow-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Test signed-source authorization against synthetic Git histories
        run: python3 -m unittest scripts/tests/test_internal_distribution_source_gate.py

      - name: Audit GitHub workflows and composite actions
        run: >-
          uvx "zizmor@${ZIZMOR_VERSION}"
          --format=github
          --min-confidence=high
          --min-severity=high
          --collect=workflows,actions
          .
        env:
          GH_TOKEN: ${{ github.token }}
