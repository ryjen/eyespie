name: Validate Common cinterop shim

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/validate-common-cinterop-shim.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Set up CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 --no-document

      - name: Configure and compile all four local pods
        shell: bash
        run: |
          set -euo pipefail
          cp env.example .env.local

          cat > iosApp/MediaPipePodspecs/EyespieMediaPipeTasksCommonInterop.h <<'EOF'
          #pragma once

          /* Common has no public API; retain it in the synthetic pod graph. */
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("eyespie/build.gradle.kts")
          text = path.read_text()
          old = '''        // Common and GenAIC are implementation pods. Their API pods pull them
                  // transitively, so Kotlin cinterop is generated only for public frameworks.
                  pod("EyespieMediaPipeTasksVision") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksVision"
                      packageName = "MediaPipeTasksVision"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }
                  pod("EyespieMediaPipeTasksGenAI") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksGenAI"
                      packageName = "MediaPipeTasksGenAI"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }'''
          new = '''        // Declare all local pods so Kotlin's synthetic Podfile resolves the
                  // complete graph. Use absolute XCFramework headers for cinterop.
                  val mediaPipeSyntheticPods = layout.buildDirectory.dir("cocoapods/synthetic/ios/Pods").get().asFile
                  pod("EyespieMediaPipeTasksCommon") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      headers = project.file("../iosApp/MediaPipePodspecs/EyespieMediaPipeTasksCommonInterop.h").absolutePath
                      packageName = "MediaPipeTasksCommon"
                  }
                  pod("EyespieMediaPipeTasksVision") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      headers = mediaPipeSyntheticPods.resolve("EyespieMediaPipeTasksVision/frameworks/MediaPipeTasksVision.xcframework/ios-arm64_x86_64-simulator/MediaPipeTasksVision.framework/Headers/MediaPipeTasksVision.h").absolutePath
                      packageName = "MediaPipeTasksVision"
                      useInteropBindingFrom("EyespieMediaPipeTasksCommon")
                  }
                  pod("EyespieMediaPipeTasksGenAIC") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      headers = mediaPipeSyntheticPods.resolve("EyespieMediaPipeTasksGenAIC/frameworks/MediaPipeTasksGenAIC.xcframework/ios-arm64_x86_64-simulator/MediaPipeTasksGenAIC.framework/Headers/MediaPipeTasksGenAIC.h").absolutePath
                      packageName = "MediaPipeTasksGenAIC"
                      useInteropBindingFrom("EyespieMediaPipeTasksCommon")
                  }
                  pod("EyespieMediaPipeTasksGenAI") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      headers = mediaPipeSyntheticPods.resolve("EyespieMediaPipeTasksGenAI/frameworks/MediaPipeTasksGenAI.xcframework/ios-arm64_x86_64-simulator/MediaPipeTasksGenAI.framework/Headers/MediaPipeTasksGenAI.h").absolutePath
                      packageName = "MediaPipeTasksGenAI"
                      useInteropBindingFrom("EyespieMediaPipeTasksGenAIC")
                  }'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one API-only MediaPipe pod block")
          path.write_text(text.replace(old, new))
          PY

          ./gradlew \
            :app:podspec \
            :app:generateDummyFramework \
            :app:compileKotlinIosSimulatorArm64 \
            :app:compileTestKotlinIosSimulatorArm64 \
            --no-daemon \
            --stacktrace

          (
            cd iosApp
            rm -rf Pods Podfile.lock
            pod install --repo-update
          )

          git diff --check
          for pod in \
            EyespieMediaPipeTasksCommon \
            EyespieMediaPipeTasksVision \
            EyespieMediaPipeTasksGenAIC \
            EyespieMediaPipeTasksGenAI; do
            grep -F "spec.dependency '$pod'" eyespie/eyespie.podspec
            grep -F "$pod (0.10.26.1)" iosApp/Podfile.lock
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            eyespie/build.gradle.kts \
            eyespie/eyespie.podspec \
            iosApp/MediaPipePodspecs/EyespieMediaPipeTasksCommonInterop.h \
            iosApp/Podfile.lock
          git commit -m "fix(ios): bind MediaPipe pods through absolute headers"
          git push origin HEAD:agent/mediapipe-ios-0.10.26.1
