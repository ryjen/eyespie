name: Validate Common cinterop shim

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/validate-common-cinterop-shim.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Set up CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 --no-document

      - name: Configure four-pod cinterop graph
        shell: bash
        run: |
          set -euo pipefail
          cp env.example .env.local

          cat > iosApp/MediaPipePodspecs/EyespieMediaPipeTasksCommonInterop.h <<'EOF'
          #pragma once
          /* Common has no public API; retain it in the synthetic pod graph. */
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("eyespie/build.gradle.kts")
          text = path.read_text()
          old = '''        // Common and GenAIC are implementation pods. Their API pods pull them
                  // transitively, so Kotlin cinterop is generated only for public frameworks.
                  pod("EyespieMediaPipeTasksVision") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksVision"
                      packageName = "MediaPipeTasksVision"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }
                  pod("EyespieMediaPipeTasksGenAI") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksGenAI"
                      packageName = "MediaPipeTasksGenAI"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }'''
          new = '''        val mediaPipeFallbackHeader = project.file("../iosApp/MediaPipePodspecs/EyespieMediaPipeTasksCommonInterop.h").absolutePath
                  fun mediaPipeHeader(property: String): String =
                      providers.gradleProperty(property).orNull ?: mediaPipeFallbackHeader

                  pod("EyespieMediaPipeTasksCommon") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      headers = mediaPipeFallbackHeader
                      packageName = "MediaPipeTasksCommon"
                  }
                  pod("EyespieMediaPipeTasksVision") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      headers = mediaPipeHeader("mediapipeVisionHeader")
                      packageName = "MediaPipeTasksVision"
                      useInteropBindingFrom("EyespieMediaPipeTasksCommon")
                  }
                  pod("EyespieMediaPipeTasksGenAIC") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      headers = mediaPipeHeader("mediapipeGenAICHeader")
                      packageName = "MediaPipeTasksGenAIC"
                      useInteropBindingFrom("EyespieMediaPipeTasksCommon")
                  }
                  pod("EyespieMediaPipeTasksGenAI") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      headers = mediaPipeHeader("mediapipeGenAIHeader")
                      packageName = "MediaPipeTasksGenAI"
                      useInteropBindingFrom("EyespieMediaPipeTasksGenAIC")
                  }'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one API-only MediaPipe pod block")
          path.write_text(text.replace(old, new))
          PY

      - name: Install synthetic pods and discover headers
        id: headers
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:podInstallSyntheticIos --no-daemon --no-configuration-cache --stacktrace

          root="$PWD/eyespie/build/cocoapods"
          find "$root" -type f -name 'MediaPipeTasks*.h' -print | sort

          vision="$(find "$root" -type f -name 'MediaPipeTasksVision.h' -print -quit)"
          genaic="$(find "$root" -type f -name 'MediaPipeTasksGenAIC.h' -print -quit)"
          genai="$(find "$root" -type f -name 'MediaPipeTasksGenAI.h' -print -quit)"
          test -n "$vision"
          test -n "$genaic"
          test -n "$genai"
          printf 'vision=%s\n' "$vision" >> "$GITHUB_OUTPUT"
          printf 'genaic=%s\n' "$genaic" >> "$GITHUB_OUTPUT"
          printf 'genai=%s\n' "$genai" >> "$GITHUB_OUTPUT"

      - name: Compile Kotlin with discovered headers
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :app:podspec \
            :app:generateDummyFramework \
            :app:compileKotlinIosSimulatorArm64 \
            :app:compileTestKotlinIosSimulatorArm64 \
            -PmediapipeVisionHeader='${{ steps.headers.outputs.vision }}' \
            -PmediapipeGenAICHeader='${{ steps.headers.outputs.genaic }}' \
            -PmediapipeGenAIHeader='${{ steps.headers.outputs.genai }}' \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Verify generated graph
        shell: bash
        run: |
          set -euo pipefail
          for pod in \
            EyespieMediaPipeTasksCommon \
            EyespieMediaPipeTasksVision \
            EyespieMediaPipeTasksGenAIC \
            EyespieMediaPipeTasksGenAI; do
            grep -F "spec.dependency '$pod'" eyespie/eyespie.podspec
          done
