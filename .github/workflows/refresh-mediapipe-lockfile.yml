name: Refresh MediaPipe lockfile

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/refresh-mediapipe-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Set up CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 --no-document

      - name: Generate framework and authoritative lockfile
        shell: bash
        run: |
          set -euo pipefail
          cp env.example .env.local
          ./gradlew :app:generateDummyFramework --no-daemon --stacktrace
          cd iosApp
          rm -rf Pods Podfile.lock
          pod install --repo-update
          for pod in \
            EyespieMediaPipeTasksCommon \
            EyespieMediaPipeTasksVision \
            EyespieMediaPipeTasksGenAIC \
            EyespieMediaPipeTasksGenAI; do
            grep -Fq "$pod (0.10.26.1)" Podfile.lock
          done
          if grep -Eq '^  - MediaPipeTasks(Common|Vision|GenAIC|GenAI)' Podfile.lock; then
            echo "official MediaPipe pods unexpectedly resolved" >&2
            exit 1
          fi

      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/mediapipe-ios-0.10.26.1"
          rm .github/workflows/refresh-mediapipe-lockfile.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iosApp/Podfile.lock .github/workflows/refresh-mediapipe-lockfile.yml
          git commit -m "fix(ios): lock namespaced MediaPipe pod graph"

          # CocoaPods also updates generated workspace/project files. Discard those
          # after the authoritative lockfile is committed so the rebase is clean.
          git reset --hard HEAD
          git clean -fdx
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin HEAD:"$branch"
