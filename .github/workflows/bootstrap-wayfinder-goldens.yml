name: Bootstrap Wayfinder goldens

on:
  push:
    branches: [feat/287-wayfinder-goldens]

permissions:
  contents: write

jobs:
  commit-goldens:
    if: ${{ !contains(github.event.head_commit.message, '[golden-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/287-wayfinder-goldens
          persist-credentials: true

      - name: Install tools with mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.7.13
          install: true
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Record reviewed references
        run: ./gradlew :app:recordRoborazziDebug --no-daemon --stacktrace

      - name: Commit reference images once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eyespie/src/androidUnitTest/goldens/wayfinder/*.png
          if git diff --cached --quiet; then
            echo "No golden changes to commit"
            exit 0
          fi
          git commit -m "test(ui): commit Wayfinder reference images [golden-bootstrap]"
          git push origin HEAD:feat/287-wayfinder-goldens
