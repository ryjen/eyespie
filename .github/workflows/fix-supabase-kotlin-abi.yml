name: Fix Supabase Kotlin ABI

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/fix-supabase-kotlin-abi.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Restore Kotlin 2.2 compatible Supabase release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("gradle/libs.versions.toml")
          text = path.read_text()
          old = 'supabaseKt = "3.4.1"'
          new = 'supabaseKt = "3.2.0"'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one {old!r} entry")
          path.write_text(text.replace(old, new))
          PY

          rm .github/workflows/fix-supabase-kotlin-abi.yml
          git diff --check
          grep -Fxq 'supabaseKt = "3.2.0"' gradle/libs.versions.toml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): restore Kotlin 2.2 compatible Supabase"
          git push origin HEAD:agent/mediapipe-ios-0.10.26.1
