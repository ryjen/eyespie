name: Deploy public site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/validate_public_site.py"
      - "tests/public_site.spec.js"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/validate_public_site.py"
      - "tests/public_site.spec.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate static site
        run: python3 scripts/validate_public_site.py

      - name: Install browser smoke-test tooling
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory site > /tmp/eyespie-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/eyespie-site.log
              exit 1
            fi
            sleep 0.25
          done

          curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null
          npx playwright test tests/public_site.spec.js \
            --browser=chromium \
            --workers=1 \
            --reporter=line

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
