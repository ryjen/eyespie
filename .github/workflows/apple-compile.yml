name: Apple Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apple-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile-apple
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Create build configuration
        run: cp env.example .env.local

      - name: Compile Apple production and test sources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/reports/apple-compile
          ./gradlew \
            :app:compileKotlinIosSimulatorArm64 \
            :app:compileTestKotlinIosSimulatorArm64 \
            --no-daemon \
            --build-cache \
            --configuration-cache \
            2>&1 | tee build/reports/apple-compile/gradle.log

      - name: Upload Apple compile diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eyespie-apple-compile-diagnostics-${{ github.sha }}
          path: |
            build/reports/apple-compile/**
            **/build/reports/problems/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
