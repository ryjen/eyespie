name: Restore full MediaPipe cinterop graph

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/restore-mediapipe-full-cinterop.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Set up CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 --no-document

      - name: Restore all four local pod sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path("eyespie/build.gradle.kts")
          text = build.read_text()
          old = '''        // Common and GenAIC are implementation pods. Their API pods pull them
                  // transitively, so Kotlin cinterop is generated only for public frameworks.
                  pod("EyespieMediaPipeTasksVision") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksVision"
                      packageName = "MediaPipeTasksVision"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }
                  pod("EyespieMediaPipeTasksGenAI") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksGenAI"
                      packageName = "MediaPipeTasksGenAI"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }'''
          new = '''        // Declare every local pod explicitly so the Kotlin synthetic Podfile can
                  // resolve the complete namespaced graph. Official XCFramework module names
                  // are preserved for cinterop while pod identities remain project-specific.
                  pod("EyespieMediaPipeTasksCommon") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksCommon"
                      packageName = "MediaPipeTasksCommon"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                  }
                  pod("EyespieMediaPipeTasksVision") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksVision"
                      packageName = "MediaPipeTasksVision"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                      useInteropBindingFrom("EyespieMediaPipeTasksCommon")
                  }
                  pod("EyespieMediaPipeTasksGenAIC") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksGenAIC"
                      packageName = "MediaPipeTasksGenAIC"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                      useInteropBindingFrom("EyespieMediaPipeTasksCommon")
                  }
                  pod("EyespieMediaPipeTasksGenAI") {
                      version = "0.10.26.1"
                      source = path(project.file("../iosApp/MediaPipePodspecs"))
                      moduleName = "MediaPipeTasksGenAI"
                      packageName = "MediaPipeTasksGenAI"
                      extraOpts += listOf("-compiler-option", "-fmodules")
                      useInteropBindingFrom("EyespieMediaPipeTasksGenAIC")
                  }'''
          if text.count(old) != 1:
              raise SystemExit("expected public-only MediaPipe CocoaPods block was not found exactly once")
          build.write_text(text.replace(old, new))

          workflow = Path(".github/workflows/ios-mediapipe.yml")
          text = workflow.read_text()
          old_assert = '''          for pod in EyespieMediaPipeTasksVision EyespieMediaPipeTasksGenAI; do
                      if ! grep -Fq "pod(\\\"$pod\\\")" eyespie/build.gradle.kts; then
                        echo "Kotlin CocoaPods does not bind API pod $pod" >&2
                        exit 1
                      fi
                    done
                    for pod in EyespieMediaPipeTasksCommon EyespieMediaPipeTasksGenAIC; do
                      if grep -Fq "pod(\\\"$pod\\\")" eyespie/build.gradle.kts; then
                        echo "Kotlin CocoaPods must not generate cinterop for implementation pod $pod" >&2
                        exit 1
                      fi
                    done'''
          new_assert = '''          for pod in \\
                      EyespieMediaPipeTasksCommon \\
                      EyespieMediaPipeTasksVision \\
                      EyespieMediaPipeTasksGenAIC \\
                      EyespieMediaPipeTasksGenAI; do
                      if ! grep -Fq "pod(\\\"$pod\\\")" eyespie/build.gradle.kts; then
                        echo "Kotlin CocoaPods does not declare $pod" >&2
                        exit 1
                      fi
                    done'''
          if text.count(old_assert) != 1:
              raise SystemExit("expected public-only workflow assertion was not found exactly once")
          text = text.replace(old_assert, new_assert)

          old_generated = '''          for pod in EyespieMediaPipeTasksVision EyespieMediaPipeTasksGenAI; do
                      grep -Fq "spec.dependency '$pod'" eyespie/eyespie.podspec
                    done
                    for pod in EyespieMediaPipeTasksCommon EyespieMediaPipeTasksGenAIC; do
                      if grep -Fq "spec.dependency '$pod'" eyespie/eyespie.podspec; then
                        echo "Generated eyespie podspec directly declares implementation pod $pod" >&2
                        exit 1
                      fi
                    done'''
          new_generated = '''          for pod in \\
                      EyespieMediaPipeTasksCommon \\
                      EyespieMediaPipeTasksVision \\
                      EyespieMediaPipeTasksGenAIC \\
                      EyespieMediaPipeTasksGenAI; do
                      grep -Fq "spec.dependency '$pod'" eyespie/eyespie.podspec
                    done'''
          if text.count(old_generated) != 1:
              raise SystemExit("expected public-only generated-podspec assertion was not found exactly once")
          workflow.write_text(text.replace(old_generated, new_generated))
          PY

          rm -f .github/workflows/inspect-mediapipe-archives.yml
          cp env.example .env.local

      - name: Regenerate Kotlin and CocoaPods metadata
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:podspec :app:generateDummyFramework --no-daemon --stacktrace
          cd iosApp
          rm -rf Pods Podfile.lock
          pod install --repo-update
          for pod in \
            EyespieMediaPipeTasksCommon \
            EyespieMediaPipeTasksVision \
            EyespieMediaPipeTasksGenAIC \
            EyespieMediaPipeTasksGenAI; do
            grep -Fq "$pod (0.10.26.1)" Podfile.lock
          done

      - name: Commit regenerated graph
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/mediapipe-ios-0.10.26.1"
          rm .github/workflows/restore-mediapipe-full-cinterop.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            eyespie/build.gradle.kts \
            eyespie/eyespie.podspec \
            iosApp/Podfile.lock \
            .github/workflows/ios-mediapipe.yml \
            .github/workflows/inspect-mediapipe-archives.yml \
            .github/workflows/restore-mediapipe-full-cinterop.yml
          git commit -m "fix(ios): restore complete MediaPipe cinterop graph"
          git reset --hard HEAD
          git clean -fdx
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin HEAD:"$branch"
