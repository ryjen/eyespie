name: Repair MediaPipe source contract

on:
  push:
    branches:
      - agent/mediapipe-ios-0.10.26.1
    paths:
      - .github/workflows/repair-mediapipe-source.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Commit authoritative generated podspec and validation workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("eyespie/build.gradle.kts").read_text()
          required = [
              "EyespieMediaPipeTasksCommon",
              "EyespieMediaPipeTasksVision",
              "EyespieMediaPipeTasksGenAIC",
              "EyespieMediaPipeTasksGenAI",
          ]
          missing = [pod for pod in required if f'pod("{pod}")' not in gradle]
          if missing:
              raise SystemExit(f"Gradle is missing namespaced pods: {missing}")
          if 'pod("MediaPipeTasksVision")' in gradle or 'pod("MediaPipeTasksGenAI")' in gradle:
              raise SystemExit("Gradle still declares official MediaPipe pods")

          podspec = Path("eyespie/eyespie.podspec")
          text = podspec.read_text()
          old = "    spec.dependency 'MediaPipeTasksGenAI'\n    spec.dependency 'MediaPipeTasksVision'"
          new = "\n".join([
              "    spec.dependency 'EyespieMediaPipeTasksCommon', '= 0.10.26.1'",
              "    spec.dependency 'EyespieMediaPipeTasksVision', '= 0.10.26.1'",
              "    spec.dependency 'EyespieMediaPipeTasksGenAIC', '= 0.10.26.1'",
              "    spec.dependency 'EyespieMediaPipeTasksGenAI', '= 0.10.26.1'",
          ])
          if text.count(old) != 1:
              raise SystemExit("expected exactly one legacy generated podspec dependency block")
          podspec.write_text(text.replace(old, new))

          workflow = Path(".github/workflows/ios-mediapipe.yml")
          text = workflow.read_text()
          start_marker = "      - name: Configure Kotlin CocoaPods dependencies for integration test\n"
          end_marker = "      - name: Assert MediaPipe pod contract\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("expected unique integration workflow markers")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          workflow.write_text(text[:start] + text[end:])
          PY

          rm .github/workflows/repair-mediapipe-source.yml
          git diff --check
          grep -n "spec.dependency" eyespie/eyespie.podspec
          if grep -Fq "Configure Kotlin CocoaPods dependencies for integration test" .github/workflows/ios-mediapipe.yml; then
            echo "transient source mutation step remains" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ios): align generated podspec with namespaced pods"
          git push origin HEAD:agent/mediapipe-ios-0.10.26.1
